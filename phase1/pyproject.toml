[project]
name = "amp-portfolio-phase1"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.5.1",
  "numpy>=1.26,<2",
  "pandas>=2,<3",
  "fair-esm==2.0.0",
  "einops>=0.7",
  "ema-pytorch>=0.4",
  "tqdm>=4.60",
  "pytest>=8,<9",
  "scikit-learn>=1.5,<1.6",
  "rapidfuzz>=3.9,<4",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
