[project]
name = "amp-protgpt2-lora"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.5.1",
  "numpy>=1.26,<2",
  "transformers==4.46.3",
  "peft==0.13.2",
  "accelerate==1.1.1",
  "safetensors>=0.4.3",
  "pytest>=8,<9",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
